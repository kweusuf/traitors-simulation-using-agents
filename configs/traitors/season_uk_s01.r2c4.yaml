  - mission
  - mission
  - public_discussion
  - private_chat
  - round_table
  - voting
  - elimination
  - traitor_night

communication:
  public_messages_per_agent: 1
  private_messages_per_agent: 2
  transcript_messages_per_prompt: 40

llm:
  provider: ollama
  model: hauhau-qwen:latest
  base_url: http://HOST_A:11434  # override per machine
  temperature: 0.7
  max_tokens: 512
  reasoning_effort: none
  timeout_seconds: 300
  retries: 3
  max_concurrency: 4
  options: {}

seed: 42

observability:
  enabled: false
  provider: langfuse
