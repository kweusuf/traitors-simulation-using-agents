# r2 resume variant: identical to season_uk_s01.r2.yaml except
# max_concurrency is 4 instead of 8.
#
# r1 is resuming at concurrency 16 against the same host at the same time.
# 16 + 8 = 24 in-flight calls was taken to be the load that wedged this host
# and killed r1 and r2 outright, so the resumed r2 runs at 4 instead. That
# attribution has since been withdrawn: the losses were coming from the
# client announcing `Connection: close` on every request, not from how many
# were in flight (see the header of season_uk_s01.fix_hl.yaml). The value is
# left at 4 so this run stays comparable to the ones measured against it.
# Game logic is unaffected either way: concurrency only decides how many
# turns are in flight, not what any of them decide.
#
# Season replay: The Traitors (UK), Series 1 (BBC One, 2022).
#
# Ground truth lives in configs/seasons/the-traitors-uk-s01.yaml and the
# personalities in configs/personas/uk_s01/ are written from that cast's
# on-screen behaviour. The three original traitors are pinned so the run
# starts from the same information the season did, and the finale counts
# match the real final five (three faithful against two traitors).

game:
  name: season_uk_s01
  players: 22
  traitors: 3
  traitor_names: [wilf, amanda, alyssa]
  # Series 1 recruited twice, once declined and once by ultimatum, and it
  # never replaced a banished traitor with a converted faithful. Our
  # recruit-on-banish rule would refill the tower every time, which would
  # make a faithful win arithmetically impossible and distort any
  # comparison with the real season, so it is off here. Recruitment as a
  # choice mirrors what actually happened: the traitors only get a window
  # after a banishment, they choose whether to recruit or murder, and the
  # offered player may refuse.
  recruit_on_banish: false
  recruit_choice: true
  # Both Series 1 recruitment attempts came the night after one of
  # the traitors was banished (episode 7 after Alyssa, episode 11
  # after Amanda), which is exactly the banishment window. Turning
  # this off offers the choice every traitor night instead, which
  # is a departure from the season being replayed.
  recruit_window: true
  # Series 1 made exactly two recruitment attempts: one declined and
  # one accepted by ultimatum. Capping it also keeps the cadence
  # close to the show, where most nights were a murder.
  max_recruits: 2
  finale_traitors: 2
  finale_faithful: 3
  # The real endgame began at the final five, whatever the split,
  # so the total rule starts it there as well.
  finale_total: 5
  max_rounds: 18   # quiet rounds and recruited nights push the endgame later than 12
  finale_max_votes: 10
  # Series 1 cadence: episode 1 opened with no murder at all (the
  # traitors chose only at the end of the second night), and episode 8
  # had no round-table banishment, because the players refused to vote
  # and the host let them stop.
  quiet_murder_rounds: [1]
  quiet_banishment_rounds: [8]
  # Series 1 ended with the real endgame: the finalists chose whether to
  # stop or banish again, and a banishment revealed nothing until the
  # game was over. Both flags mirror that.
  endgame_vote: true
  blind_finale_banishments: true
  # Series 1 used the shield and a one-off on-trial murder restriction.
  # It never had a seer or a dagger.
  shield: true
  # Audit fidelity phases 1-4 (host debate clock, round-table
  # nomination and rebuttal, tie revote, sequential council).
  # Default-off in GameSettings for backward compatibility; a
  # season replay wants them on.
  discussion_budget: 2
  warning_turns: 1
  nomination_enabled: true
  revote_enabled: true
  council_deliberation: true
  seer: false
  dagger: false
  on_trial: false
  player_names:
    - aaron
    - hannah
    - meryl
    - wilf
    - kieran
    - maddy
    - andrea
    - amanda
    - fay
