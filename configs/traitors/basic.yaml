# Basic Traitors configuration (spec sections 22 and 32).

game:
  name: basic_traitors
  players: 6
  traitors: 2
  faithful: 4
  max_rounds: 5

# Phase ordering is configurable (spec section 7).
phases:
  - mission
  - public_discussion
  - private_chat
  - round_table
  - voting
  - elimination
  - traitor_night

communication:
  public_messages_per_agent: 1
  private_messages_per_agent: 2

llm:
  provider: ollama
  model: gpt-oss:20b
  temperature: 0.7
  max_tokens: 512
  reasoning_effort: medium
  timeout_seconds: 120
  max_concurrency: 2

# Deterministic per-game seed; batch runs derive one seed per game.
seed: 42

observability:
  enabled: false
  provider: langfuse
