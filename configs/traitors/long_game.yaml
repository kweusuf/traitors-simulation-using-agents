# Long game: 21 players, 3 traitors, one day/night cycle per round
# (spec sections 2 and 7). `mission` appears three times so every day
# has multiple tasks; `traitor_night` runs after the round table so the
# traitors murder every night.

game:
  name: long_game
  players: 21
  traitors: 3          # faithful is derived: 18
  max_rounds: 12
  # A traitor banished at the round table converts one living faithful
  # player on the way out, so the faithful cannot shrink the traitor
  # team by voting alone. `max_recruits: 0` means no cap; set it to a
  # positive number to give the faithful a path back.
  recruit_on_banish: true
  max_recruits: 0
  # Finale: normal play stops at exactly 3 traitors and 3 faithful and
  # rapid-fire voting (round table, side conversations, vote, banish)
  # decides the winner. If votes tie for `finale_max_votes` rounds in a
  # row, `round_limit_winner` is declared instead.
  finale_traitors: 3
  finale_faithful: 3
  finale_max_votes: 10
  # Wave B mechanics: missions award one item per round (shield, then
  # dagger, then seer), and the traitors nominate a murder shortlist so
  # only those players can die at night.
  shield: true
  dagger: true
  seer: true
  on_trial: true
  player_names:
    - alice
    - bob
    - charlie
    - david
    - eve
    - frank
    - grace
    - heidi
    - ivan
    - judy
    - karen
    - leo
    - mallory
    - nina
    - oscar
    - peggy
    - quinn
    - rachel
    - sam
    - tina
    - victor

# Day: tasks first, then discussion and side conversations. Night:
# round table, vote, banishment, then the traitor murder.
phases:
  - mission
  - mission
  - mission
  - public_discussion
  - private_chat
  - round_table
  - voting
  - elimination
  - traitor_night

communication:
  public_messages_per_agent: 1
  private_messages_per_agent: 2
  # Prompts carry only the newest transcript lines. The full late-game
  # transcript is ~168k characters (~31k tokens) and is re-evaluated on
  # every single call, which is what made rounds take over an hour.
  transcript_messages_per_prompt: 40

# Same model settings as basic.yaml; point at a remote host with
# `--base-url http://<ip>:11434` on the CLI.
llm:
  provider: ollama
  model: hauhau-qwen:latest
  base_url: http://localhost:11434
  temperature: 0.7
  max_tokens: 512
  reasoning_effort: none
  # Headroom for a cold model load on the remote host: Ollama
  # unloads after ~5 idle minutes, and a reload can take a while.
  timeout_seconds: 300
  retries: 3              # extra attempts for timeouts and 5xx
  # Measured on the remote host: 4 concurrent calls give ~3.4x the
  # throughput of serial calls (turns within a phase run together).
  max_concurrency: 4
  options: {}

seed: 42

observability:
  enabled: false
  provider: langfuse
