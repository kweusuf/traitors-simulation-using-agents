# Long game: 21 players, 3 traitors, one day/night cycle per round
# (spec sections 2 and 7). `mission` appears three times so every day
# has multiple tasks; `traitor_night` runs after the round table so the
# traitors murder every night.

game:
  name: long_game
  players: 21
  traitors: 3          # faithful is derived: 18
  max_rounds: 12
  # A traitor banished at the round table converts one living faithful
  # player on the way out, so the faithful cannot shrink the traitor
  # team by voting alone. `max_recruits: 0` means no cap; set it to a
  # positive number to give the faithful a path back.
  recruit_on_banish: true
  max_recruits: 0
  player_names:
    - alice
    - bob
    - charlie
    - david
    - eve
    - frank
    - grace
    - heidi
    - ivan
    - judy
    - karen
    - leo
    - mallory
    - nina
    - oscar
    - peggy
    - quinn
    - rachel
    - sam
    - tina
    - victor

# Day: tasks first, then discussion and side conversations. Night:
# round table, vote, banishment, then the traitor murder.
phases:
  - mission
  - mission
  - mission
  - public_discussion
  - private_chat
  - round_table
  - voting
  - elimination
  - traitor_night

communication:
  public_messages_per_agent: 1
  private_messages_per_agent: 2

# Same model settings as basic.yaml; point at a remote host with
# `--base-url http://<ip>:11434` on the CLI.
llm:
  provider: ollama
  model: hauhau-qwen:latest
  base_url: http://localhost:11434
  temperature: 0.7
  max_tokens: 512
  reasoning_effort: none
  timeout_seconds: 120
  max_concurrency: 2
  options: {}

seed: 42

observability:
  enabled: false
  provider: langfuse
