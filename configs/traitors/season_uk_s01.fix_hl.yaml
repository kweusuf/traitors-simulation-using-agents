# Hinglish control for the end-vote fix (commit d3cec12), run against its
# English twin in a different language.
#
# Generated from season_uk_s01.hinglish.yaml, which stays as the baseline.
# Identical to the English control in every setting except `language`, so the
# pair is a single-variable experiment: any difference between them is the
# language.
#
# The personas stay in English on purpose. They are behavioural
# instructions; translating them too would vary two things at once. The
# language rule moves only what the agents say, and the engine's decision
# words stay English.
#
# Host: the same one as the English control, and model-matched to it.
#
# Findings from running this pair, worth keeping because each one cost a run:
#
# 1. What read as a host concurrency ceiling was the client's connection
#    handling. Every call went out through `urllib.request.urlopen`, which
#    announces `Connection: close` on each request and cannot be told
#    otherwise; a server that answers a close-announced request by closing
#    it turned most calls into `RemoteDisconnected`. The same requests over
#    a kept-alive connection were not dropped at all, at the same
#    concurrency, in the same minute. So the in-flight levels recorded here
#    - one clean, one degraded, one that wedged the host - are observations
#    made through that client, not a measured host capacity. The provider
#    now holds its connection (models/ollama.py); re-measure before treating
#    any in-flight number as a ceiling.
# 2. The same model tag does not imply the same weights. The two hosts
#    carried different digests under an identical tag, so a split-host pair
#    could never have isolated language anyway. Verify the digest on every
#    host before treating a pair as single-variable.
# 3. A single-call smoke test cannot clear a host for a run. One call
#    returned valid JSON while most calls were being dropped, which is the
#    same trap from the other side: probe at the concurrency you will run,
#    over the transport you will run on.
#
# Consequence worth fixing separately: a transport failure kills an
# eight-hour run outright instead of skipping one action. The resume
# machinery exists for this and tools/run_rand_sweep.py invokes it per arm;
# a run started by hand still dies where it stands. Resume also assumes the
# failure was transient: an arm that dies in the same phase every time
# spends its attempts replaying that phase rather than making progress, and
# its log looks like a run in flight while nothing advances.


game:
  name: season_uk_s01_hinglish_fix
  players: 22
  traitors: 3
  traitor_names: [wilf, amanda, alyssa]
  recruit_on_banish: false
  recruit_choice: true
  # Agent memory: decaying, per-observer. Now the default, stated here so
  # this config records what the run actually did, and kept identical to
  # the English config so the pair still differs by language alone.
  agent_memory: true
  recruit_window: true
  max_recruits: 2
  finale_traitors: 2
  finale_faithful: 3
  finale_total: 5
  max_rounds: 18
  finale_max_votes: 10
  quiet_murder_rounds: [1]
  quiet_banishment_rounds: [8]
  endgame_vote: true
  blind_finale_banishments: true
  shield: true
  # Copied from the English control so the pair differs by language alone.
  # The Hinglish baseline this was generated from left all four off, so
  # the earlier uk-s01-hl run was not a single-variable experiment against
  # r1/r2/r3 despite what that config's header claimed: the hosted debate
  # clock, open nomination and rebuttal, the tie revote and the
  # sequential council were all silently disabled in it.
  discussion_budget: 2
  warning_turns: 1
  nomination_enabled: true
  revote_enabled: true
  council_deliberation: true
  seer: false
  dagger: false
  on_trial: false
  # Every agent's speech is generated in Hinglish (Roman-script
  # Hindi-English). The engine's decision words stay English.
  language: hinglish
  player_names:
    - aaron
    - hannah
    - meryl
    - wilf
    - kieran
    - maddy
    - andrea
    - amanda
    - fay
    - theo
    - amos
    - alex
    - rayan
    - alyssa
    - matt
    - tom
    - john
    - ivan
    - imran
    - claire
    - nicky
    - aisha
  personas:
    - uk_s01/aaron
    - uk_s01/hannah
    - uk_s01/meryl
    - uk_s01/wilf
    - uk_s01/kieran
    - uk_s01/maddy
    - uk_s01/andrea
    - uk_s01/amanda
    - uk_s01/fay
    - uk_s01/theo
    - uk_s01/amos
    - uk_s01/alex
    - uk_s01/rayan
    - uk_s01/alyssa
    - uk_s01/matt
    - uk_s01/tom
    - uk_s01/john
    - uk_s01/ivan
    - uk_s01/imran
    - uk_s01/claire
    - uk_s01/nicky
    - uk_s01/aisha

phases:
  - mission
  - mission
  - mission
  - public_discussion
  - private_chat
  - round_table
  - voting
  - elimination
  - traitor_night

communication:
  public_messages_per_agent: 1
  private_messages_per_agent: 2
  transcript_messages_per_prompt: 40

llm:
  provider: ollama
  model: hauhau-qwen:latest
  base_url: http://HOST_A:11434  # override per machine; see the header note
  temperature: 0.7
  # 768, raised from 512. Hinglish output runs long: in this very run it
  # p50'd at 313 tokens and p99'd at exactly the old 512 cap, with 11
  # replies truncated mid-sentence and lost to a JSON parse error. 768
  # clears the observed p99 with headroom without doubling the tail
  # latency, since only ~2% of replies go past 512.
  max_tokens: 768
  reasoning_effort: none
  timeout_seconds: 300
  retries: 3
  # 4 in flight, matching the English control so the pair differs by
  # language alone, and left at 4 so this run stays comparable to the ones
  # already recorded on this arm. Not a measured host limit: the readings
  # that named 8 in flight as clean and 16 as degraded came through a client
  # that announced `Connection: close` on every request, which this server
  # dropped most of the time (see the header of fix_hl).
  # If a run stalls: --resume --idle-seconds 5
  max_concurrency: 4
  options: {}

seed: 42

observability:
  enabled: false
  provider: langfuse