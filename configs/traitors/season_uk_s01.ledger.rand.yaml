  - mission
  - mission
  - public_discussion
  - private_chat
  - round_table
  - voting
  - elimination
  - traitor_night

communication:
  public_messages_per_agent: 1
  private_messages_per_agent: 2
  transcript_messages_per_prompt: 40

llm:
  provider: ollama
  model: hauhau-qwen:latest
  base_url: http://HOST_A:11434  # override per machine
  temperature: 0.7
  # 768, raised from 512. Hinglish output runs long: in the paired run it
  # p50'd at 313 tokens and p99'd at exactly the old 512 cap, with 11
  # replies truncated mid-sentence and lost to a JSON parse error. 768
  # clears the observed p99 with headroom without doubling the tail
  # latency, since only ~2% of replies go past 512.
  max_tokens: 768
  reasoning_effort: none
  timeout_seconds: 300
  retries: 3
  # 1 in flight: the random-deal arms are meant to
  # run together on one host, so each gives up its share of the host
  # rather than every arm's calls landing at once. An in-flight level,
  # not a measured host limit - see the header of fix_hl for why the
  # earlier host numbers cannot be read as one.
  # If this run stalls: --resume --idle-seconds 5
  max_concurrency: 1
  options: {}

seed: 1

observability:
  enabled: false
  provider: langfuse
