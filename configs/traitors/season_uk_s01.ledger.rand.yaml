# GENERATED by tools/make_rand_arms.py from season_uk_s01.ledger.yaml - do not edit by hand.
#
# Random-deal variant of ledger: the tracked arm with its `traitor_names` pin
# removed, so the engine draws the traitors from the seed instead of replaying
# the season's. One deal across the whole sweep, because the draw depends on
# the seed and the cast and nothing else.
#
# seed 1: the lowest seed whose draw keeps none of
# the season's three traitors and is not a holdout seed.
#
# max_concurrency is 1 in flight per arm rather than 4, so all
# 7 arms can run at once on one host; 7 arms at 4 apiece would be
# 28 in flight. Neither number is a measured host limit: those levels came
# through a client that announced `Connection: close` on every request, which
# the server dropped most of the time (see the header of fix_hl).
#
# The rest of the file is the tracked arm byte for byte.
# GENERATED by tools/make_pointer_arms.py - do not edit by hand.
#
# Arm: ptr_mem
# Pointer required, plus a decaying pointer memory for every
#   message. This is the arm that can actually shrink the prompt:
#   the transcript is 93% of it, and without a short trace to
#   replace, there is nothing for a smaller window to fall back on.
#
# Everything except the three flags below is identical to
# season_uk_s01.fix_en.yaml, which is the `base` arm's reference.
# English control for the end-vote fix (commit d3cec12), run against its
# Hinglish twin on the same host.
#
# Generated from season_uk_s01.run.yaml, which stays as the baseline. The
# only change is the concurrency, so this run is comparable with
# uk-s01-r1/r2/r3; the thing being measured is whether the finale is still
# decided by a unanimous `end`, which the old prompt default forced in
# every one of those runs.
#
# Both controls run on the same model-matched host at concurrency 4. They
# were first split across two hosts, but the second host could not take the
# load (4/4 concurrent calls failed) and the two carried different weights
# under the identical model tag, so a split-host pair could not have isolated
# language. See season_uk_s01.fix_hl.yaml for the evidence.

game:
  name: season_uk_s01_fix
  players: 22
  traitors: 3
  # Series 1 recruited twice, once declined and once by ultimatum, and it
  # never replaced a banished traitor with a converted faithful. Our
  # recruit-on-banish rule would refill the tower every time, which would
  # make a faithful win arithmetically impossible and distort any
  # comparison with the real season, so it is off here. Recruitment as a
  # choice mirrors what actually happened: the traitors only get a window
  # after a banishment, they choose whether to recruit or murder, and the
  # offered player may refuse.
  recruit_on_banish: false
  recruit_choice: true
  # Agent memory: decaying, per-observer. Now the default, stated here so
  # this config records what the run actually did. A resumed run rebuilds
  # its memory from the event log, so the rounds before the interruption
  # are not lost.
  agent_memory: true
  # Reject a message that names a player who does not exist. A model that
  # invents one early can occupy the whole room: in the previous run a
  # phantom was introduced in round 1 and appeared in 82% of messages, and
  # the faithful spent the game investigating her while three real traitors
  # went unchallenged. Calibrated by replaying that run in order - one
  # phantom caught, zero false positives, caught at the sequence where it
  # was introduced - so the gate is on here rather than logging only.
  reject_invented_players: true
  # Treatment arm of the template-collapse experiment: the stylistic
  # constraints on public speech are ON. Stated explicitly rather than left
  # to the default, so this config records the arm it is. The control is
  # season_uk_s01.noecho.yaml, identical except this flag.
  anti_echo_instructions: true
  co_generate_gist: true
  gist_required: true
  pointer_memory: true
  # The suspicion ledger: every player keeps a private ranked list of who
  # they suspect and - shorter - who they have cleared and will defend, and
  # sees it on every turn.
  #
  # The motivation is in docs/learnings.md. Banishment was tracking chance:
  # 2 of 3 traitors caught from 17 eliminations, against ~2.3 expected by
  # random. The cause was not a missing transcript - it reached the model at
  # 21,431 characters - but that the ballot asked for a bare `target` with no
  # instruction to deduce and nowhere for the player to keep a conclusion
  # they had already reached.
  #
  # Costs one extra generation per player per round, which is why this is its
  # own arm rather than folded into the repetition one: folding two changes
  # together would make neither attributable.
  #
  # `ledger_allies` is capped at two on purpose. A long list of people you
  # have cleared is not a defence, it is a preference, and it is not worth
  # spending a turn defending in public. Short is what makes the defence
  # costly enough to mean something.
  suspicion_ledger: true
  ledger_suspects: 3
  ledger_allies: 2  # Both Series 1 recruitment attempts came the night after one of
  # the traitors was banished (episode 7 after Alyssa, episode 11
  # after Amanda), which is exactly the banishment window. Turning
  # this off offers the choice every traitor night instead, which
  # is a departure from the season being replayed.
  recruit_window: true
  # Series 1 made exactly two recruitment attempts: one declined and
  # one accepted by ultimatum. Capping it also keeps the cadence
  # close to the show, where most nights were a murder.
  max_recruits: 2
  finale_traitors: 2
  finale_faithful: 3
  # The real endgame began at the final five, whatever the split,
  # so the total rule starts it there as well.
  finale_total: 5
  max_rounds: 18   # quiet rounds and recruited nights push the endgame later than 12
  finale_max_votes: 10
  # Series 1 cadence: episode 1 opened with no murder at all (the
  # traitors chose only at the end of the second night), and episode 8
  # had no round-table banishment, because the players refused to vote
  # and the host let them stop.
  quiet_murder_rounds: [1]
  quiet_banishment_rounds: [8]
  # Series 1 ended with the real endgame: the finalists chose whether to
  # stop or banish again, and a banishment revealed nothing until the
  # game was over. Both flags mirror that.
  endgame_vote: true
  blind_finale_banishments: true
  # Series 1 used the shield and a one-off on-trial murder restriction.
  # It never had a seer or a dagger.
  shield: true
  # Audit fidelity phases 1-4 (host debate clock, round-table
  # nomination and rebuttal, tie revote, sequential council).
  # Default-off in GameSettings for backward compatibility; a
  # season replay wants them on.
  discussion_budget: 2
  warning_turns: 1
  nomination_enabled: true
  revote_enabled: true
  council_deliberation: true
  seer: false
  dagger: false
  on_trial: false
