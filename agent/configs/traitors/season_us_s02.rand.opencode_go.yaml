# Random-deal marathon arm: traitor_names removed so the seed draws
# the traitors from the whole cast. Base: season_us_s02.opencode_go.yaml.

# Us S02 replay on OpenCode Go.
#
# The season block is season_us_s02.yaml byte for byte; the llm block
# is the OpenCode Go route. The session header is unique to this
# replay so prompt caching is not shared with the other seasons.
#
game:
  mission_reward: 1000
  mission_success_probability: 0.85
  max_rounds: 18
  finale_traitors: 2
  finale_faithful: 3
  finale_total: 5
  endgame_vote: true
  blind_finale_banishments: true
  revote_enabled: true
  nomination_enabled: true
  shield: true
  dagger: true
  max_recruits: 0
  name: the-traitors-us-s02
  players: 22
  # Starting traitors only: parvati was recruited in episode 8, so she is not
  # part of the deal the season opened with.
  traitors: 2
  player_names:
  - ct
  - trishelle
  - mj
  - sheree
  - phaedra
  - john
  - peter
  - kevin
  - parvati
  - bergie
  - dan
  - janelle
  - sandra
  - tamra
  - larsa
  - makensy
  - maks
  - ekin-su
  - peppermint
  - deontay
  - carly
  - melinda
  personas:
  - us_s02/ct
  - us_s02/trishelle
  - us_s02/mj
  - us_s02/sheree
  - us_s02/phaedra
  - us_s02/john
  - us_s02/peter
  - us_s02/kevin
  - us_s02/parvati
  - us_s02/bergie
  - us_s02/dan
  - us_s02/janelle
  - us_s02/sandra
  - us_s02/tamra
  - us_s02/larsa
  - us_s02/makensy
  - us_s02/maks
  - us_s02/ekin-su
  - us_s02/peppermint
  - us_s02/deontay
  - us_s02/carly
  - us_s02/melinda
phases:
- mission
- mission
- mission
- public_discussion
- private_chat
- round_table
- voting
- elimination
- traitor_night
communication:
  public_messages_per_agent: 1
  private_messages_per_agent: 2
  transcript_messages_per_prompt: 40
llm:
  provider: openai_compat
  model: deepseek-v4.1-flash
  base_url: https://opencode.ai/inference/go/openai/v1
  api_key_env: OPENCODE_GO_API_KEY
  extra_headers:
    x-opencode-session: traitors-us-s02-opencode
  temperature: 0.7
  # DeepSeek V4.1 Flash 1017 is a reasoning model, so hidden reasoning tokens sit inside the
  # completion budget alongside the visible reply.
  max_tokens: 32768
  reasoning_effort: low
  timeout_seconds: 600
  retries: 3
  # Eight of these run together; keep each arm's share of the route modest.
  max_concurrency: 2
  options: {}
seed: 42
observability:
  enabled: false
  provider: langfuse
