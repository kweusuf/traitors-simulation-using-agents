# Random-deal marathon arm: traitor_names removed so the seed draws
# the traitors from the whole cast. Base: season_australia_s01.opencode_go.yaml.

# Australia S01 replay on OpenCode Go.
#
# The season block is season_australia_s01.yaml byte for byte; the llm block
# is the OpenCode Go route. The session header is unique to this
# replay so prompt caching is not shared with the other seasons.
#
game:
  mission_reward: 1000
  mission_success_probability: 0.85
  max_rounds: 18
  finale_traitors: 2
  finale_faithful: 3
  finale_total: 5
  endgame_vote: true
  blind_finale_banishments: true
  revote_enabled: true
  nomination_enabled: true
  shield: true
  dagger: true
  max_recruits: 0
  name: the-traitors-australia-s01
  players: 24
  # Starting traitors only: alex_duggan and kate were recruited (episodes 8
  # and 10).
  traitors: 4
  player_names:
  - alex_duggan
  - craig
  - kate
  - lewis
  - teresa
  - paul
  - nigel
  - marielle
  - fi
  - dirk
  - matt
  - mark
  - claire
  - angus
  - justine
  - olivia
  - midy
  - kashindi
  - ethan
  - mk
  - sandra
  - jack
  - millie
  - chloe
  personas:
  - australia_s01/alex_duggan
  - australia_s01/craig
  - australia_s01/kate
  - australia_s01/lewis
  - australia_s01/teresa
  - australia_s01/paul
  - australia_s01/nigel
  - australia_s01/marielle
  - australia_s01/fi
  - australia_s01/dirk
  - australia_s01/matt
  - australia_s01/mark
  - australia_s01/claire
  - australia_s01/angus
  - australia_s01/justine
  - australia_s01/olivia
  - australia_s01/midy
  - australia_s01/kashindi
  - australia_s01/ethan
  - australia_s01/mk
  - australia_s01/sandra
  - australia_s01/jack
  - australia_s01/millie
  - australia_s01/chloe
phases:
- mission
- mission
- mission
- public_discussion
- private_chat
- round_table
- voting
- elimination
- traitor_night
communication:
  public_messages_per_agent: 1
  private_messages_per_agent: 2
  transcript_messages_per_prompt: 40
llm:
  provider: openai_compat
  model: deepseek-v4.1-flash
  base_url: https://opencode.ai/inference/go/openai/v1
  api_key_env: OPENCODE_GO_API_KEY
  extra_headers:
    x-opencode-session: traitors-australia-s01-opencode
  temperature: 0.7
  # DeepSeek V4.1 Flash 1017 is a reasoning model, so hidden reasoning tokens sit inside the
  # completion budget alongside the visible reply.
  max_tokens: 32768
  reasoning_effort: low
  timeout_seconds: 600
  retries: 3
  # Eight of these run together; keep each arm's share of the route modest.
  max_concurrency: 2
  options: {}
seed: 42
observability:
  enabled: false
  provider: langfuse
