# Season replay on the Command Code Provider API.
#
# Picked at random from the ten base season configs. Everything below the
# `llm:` block is season_india_s01.yaml byte for byte, including the pin on
# the season's original starting traitors (karan_kundrra, raj_kundrra,
# jannat); harsh and purav were recruits, not originals.
#
# The endpoint is public, so this file is tracked. The API key is not: it
# comes from COMMAND_CODE_API_KEY in the gitignored .env (see .env.example).
#
# max_concurrency is 4 in flight, an ordinary API level rather than a
# measured capacity.
game:
  name: the-traitors-india-s01
  players: 20
  # Starting traitors only: harsh and purav were recruited in episode 9.
  traitors: 3
  traitor_names:
  - karan_kundrra
  - raj_kundrra
  - jannat
  # 18, not the default 5: the US S03 base replay ran the default and ended
  # by round limit with 11 players still alive, which is a truncated game
  # rather than a season. 18 matches the cadence the show-format variants
  # use, leaving room for recruitment nights to push the endgame later.
  max_rounds: 18
  player_names:
  - nikita
  - uorfi
  - harsh
  - purav
  - karan_kundrra
  - raj_kundrra
  - jannat
  - anshula
  - sudhanshu
  - sahil
  - jasmine
  - mukesh
  - maheep
  - ashish
  - elnaaz
  - raftaar
  - nitish
  - sargun
  - lakshmi
  - kunal
  personas:
  - india_s01/nikita
  - india_s01/uorfi
  - india_s01/harsh
  - india_s01/purav
  - india_s01/karan_kundrra
  - india_s01/raj_kundrra
  - india_s01/jannat
  - india_s01/anshula
  - india_s01/sudhanshu
  - india_s01/sahil
  - india_s01/jasmine
  - india_s01/mukesh
  - india_s01/maheep
  - india_s01/ashish
  - india_s01/elnaaz
  - india_s01/raftaar
  - india_s01/nitish
  - india_s01/sargun
  - india_s01/lakshmi
  - india_s01/kunal
phases:
- mission
- mission
- mission
- public_discussion
- private_chat
- round_table
- voting
- elimination
- traitor_night
communication:
  public_messages_per_agent: 1
  private_messages_per_agent: 2
  transcript_messages_per_prompt: 40
llm:
  provider: commandcode
  model: xiaomi/mimo-v2.6-flash
  base_url: https://api.commandcode.ai/provider/v1
  temperature: 0.7
  # 16384. MiMo always emits hidden reasoning (the route rejects
  # reasoning_effort "off" for this model), and visible ~1k-character
  # messages were reporting 5,000-8,000 completion tokens. 1024 and 4096
  # both ended runs on finish_reason=length.
  max_tokens: 16384
  reasoning_effort: none
  # 600, raised from 120 after a live round-5 call timed out on a 53k-char
  # prompt; a successful neighbour spent 252s across retries.
  timeout_seconds: 600
  retries: 3
  max_concurrency: 4
  options: {}
seed: 42
observability:
  enabled: false
  provider: langfuse
