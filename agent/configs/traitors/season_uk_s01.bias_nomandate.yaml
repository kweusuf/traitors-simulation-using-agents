# Generated traitor-bias experiment arm: traitor mandate + role goals off.
# Base: season_uk_s01.opencode_go.yaml. Exactly one lever differs,
# plus this header. Run with a fixed --model for a clean comparison.

# Season replay: The Traitors (UK), Series 1 (BBC One, 2022), on OpenCode Go.
#
# The season block below is season_uk_s01.yaml byte for byte, including the
# pinned original traitors and the finale counts. The llm block is the
# OpenCode Go route from season_india_s01.opencode_go.yaml; the session
# header is unique to this replay so prompt caching is not shared with the
# India run.
#
# Ground truth lives in configs/seasons/the-traitors-uk-s01.yaml and the
# personalities in configs/personas/uk_s01/ are written from that cast's
# on-screen behaviour.

game:
  traitor_mandate: false
  traitor_role_goals: false
  mission_reward: 1000
  mission_success_probability: 0.85
  revote_enabled: true
  nomination_enabled: true
  name: season_uk_s01
  players: 22
  traitors: 3
  traitor_names: [wilf, amanda, alyssa]
  # Series 1 recruited twice, once declined and once by ultimatum, and it
  # never replaced a banished traitor with a converted faithful. Our
  # recruit-on-banish rule would refill the tower every time, which would
  # make a faithful win arithmetically impossible and distort any
  # comparison with the real season, so it is off here. Recruitment as a
  # choice mirrors what actually happened: the traitors only get a window
  # after a banishment, they choose whether to recruit or murder, and the
  # offered player may refuse.
  recruit_on_banish: false
  recruit_choice: true
  # Both Series 1 recruitment attempts came the night after one of
  # the traitors was banished (episode 7 after Alyssa, episode 11
  # after Amanda), which is exactly the banishment window. Turning
  # this off offers the choice every traitor night instead, which
  # is a departure from the season being replayed.
  recruit_window: true
  # Series 1 made exactly two recruitment attempts: one declined and
  # one accepted by ultimatum. Left uncapped (0) to match the show,
  # which places no limit on how often the traitors may recruit.
  max_recruits: 0
  finale_traitors: 2
  finale_faithful: 3
  # The real endgame began at the final five, whatever the split,
  # so the total rule starts it there as well.
  finale_total: 5
  max_rounds: 18   # quiet rounds and recruited nights push the endgame later than 12
  finale_max_votes: 10
  # Series 1 cadence: episode 1 opened with no murder at all (the
  # traitors chose only at the end of the second night), and episode 8
  # had no round-table banishment, because the players refused to vote
  # and the host let them stop.
  quiet_murder_rounds: [1]
  quiet_banishment_rounds: [8]
  # Series 1 ended with the real endgame: the finalists chose whether to
  # stop or banish again, and a banishment revealed nothing until the
  # game was over. Both flags mirror that.
  endgame_vote: true
  blind_finale_banishments: true
  # Series 1 used the shield and a one-off on-trial murder restriction.
  # It never had a seer or a dagger.
  shield: true
  seer: false
  dagger: true
  on_trial: false
  player_names:
    - aaron
    - hannah
    - meryl
    - wilf
    - kieran
    - maddy
    - andrea
    - amanda
    - fay
    - theo
    - amos
    - alex
    - rayan
    - alyssa
    - matt
    - tom
    - john
    - ivan
    - imran
    - claire
    - nicky
    - aisha
  personas:
    - uk_s01/aaron
    - uk_s01/hannah
    - uk_s01/meryl
    - uk_s01/wilf
    - uk_s01/kieran
    - uk_s01/maddy
    - uk_s01/andrea
    - uk_s01/amanda
    - uk_s01/fay
    - uk_s01/theo
    - uk_s01/amos
    - uk_s01/alex
    - uk_s01/rayan
    - uk_s01/alyssa
    - uk_s01/matt
    - uk_s01/tom
    - uk_s01/john
    - uk_s01/ivan
    - uk_s01/imran
    - uk_s01/claire
    - uk_s01/nicky
    - uk_s01/aisha

phases:
  - mission
  - mission
  - mission
  - public_discussion
  - private_chat
  - round_table
  - voting
  - elimination
  - traitor_night

communication:
  public_messages_per_agent: 1
  private_messages_per_agent: 2
  transcript_messages_per_prompt: 40

llm:
  provider: openai_compat
  model: deepseek-v4.1-flash
  base_url: https://opencode.ai/inference/go/openai/v1
  api_key_env: OPENCODE_GO_API_KEY
  extra_headers:
    x-opencode-session: traitors-uk-s01-opencode
  temperature: 0.7
  # DeepSeek V4.1 Flash 1017 is a reasoning model, so hidden reasoning tokens sit inside the
  # completion budget alongside the visible reply.
  max_tokens: 32768
  reasoning_effort: low
  timeout_seconds: 600
  retries: 3
  max_concurrency: 4
  options: {}

seed: 42

observability:
  enabled: false
  provider: langfuse
