name: Site

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'agent/**'
      - 'scripts/**'
      - '.github/workflows/site.yml'
      - 'README.md'
      - 'SECURITY.md'
  pull_request:
    paths:
      - 'web/**'
      - 'agent/**'
      - 'scripts/**'
      - '.github/workflows/site.yml'
      - 'README.md'
      - 'SECURITY.md'

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen --all-extras --dev
      - run: uv run --no-sync python -m pytest -q
      - name: Audit Python dependencies
        run: |
          uv run --no-sync pip-audit --local -f json > /tmp/pip-audit.json
          test "$(jq '[.dependencies[] | select(.skip_reason == null)] | length' /tmp/pip-audit.json)" -gt 0
      - name: Scan tracked files for local detail
        working-directory: ${{ github.workspace }}
        run: python scripts/check_no_local_detail.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web audit --prod --ignore GHSA-fc5q-39xc-vjpf
      - run: pnpm --dir web check
      - run: pnpm --dir web test --run
      - run: pnpm --dir web check:data
      - run: pnpm --dir web build
